# A small production for checking the whole chain by hand: 2000 events per
# production. Same experiment as hk_t2k_like.yaml otherwise.
name: HK_tiny
baseline_km: 295.0
matter: { density_g_cm3: 2.6, electron_fraction: 0.5 }
detector: { material: water, fiducial_mass_kt: 188 }

flux_units: { pot_norm: 1.0e21, bin_norm_GeV: 0.05 }
beam_modes:
  FHC:
    pot: 6.75e21
    flux: { file: "${ZAKU_DATA}/data/flux/t2kflux_2020_plus250kA_nominal.root", t2k_detector: sk }
  RHC:
    pot: 2.025e22
    flux: { file: "${ZAKU_DATA}/data/flux/t2kflux_2020_minus250kA_nominal.root", t2k_detector: sk }
flux_covariance:
  file: "${ZAKU_DATA}/data/flux/t2kflux_2020_covariance.root"
  nd_constraint: 0.8

productions:
  - { beam: FHC, flux: numu,    interaction: numu,    n: 2000 }
  - { beam: FHC, flux: numubar, interaction: numubar, n: 2000 }
  - { beam: FHC, flux: nue,     interaction: nue,     n: 2000 }
  - { beam: FHC, flux: nuebar,  interaction: nuebar,  n: 2000 }
  - { beam: FHC, flux: numu,    interaction: nue,     n: 2000 }
  - { beam: FHC, flux: numubar, interaction: nuebar,  n: 2000 }
  - { beam: RHC, flux: numu,    interaction: numu,    n: 2000 }
  - { beam: RHC, flux: numubar, interaction: numubar, n: 2000 }
  - { beam: RHC, flux: nue,     interaction: nue,     n: 2000 }
  - { beam: RHC, flux: nuebar,  interaction: nuebar,  n: 2000 }
  - { beam: RHC, flux: numu,    interaction: nue,     n: 2000 }
  - { beam: RHC, flux: numubar, interaction: nuebar,  n: 2000 }

# --- fake detector -------------------------------------------------------------
# Response tables (true event -> detection probability and column probabilities),
# the HK tables exported from the legacy chain. `split` distributes every event
# over the columns with the probabilities as weights (deterministic).
response: { include: response/hk_2025.yaml, assignment: split }
smearing:
  lepton_momentum: { type: legacy_fractional, sigma: 0.024 }   # binned sigma_p = 0.024 p, as the legacy file
  lepton_angle:    { type: gaussian_deg, sigma: 1.8 }           # sigma_cos = sin(theta) x 1.8 degrees
  hadronic_energy: { type: stochastic, a: 0.20, b: 0.15 }       # sigma/E = a/sqrt(E) (+) b, for the calorimetric estimator
  electron_energy: { type: stochastic, a: 0.08, b: 0.03 }
  muon_energy:     { type: fractional, sigma: 0.035 }
  decay_electron_tag: { mu_plus: 0.96, mu_minus: 0.83, pi_plus: 0.45 }
energy: ccqe               # Enu_rec from the CCQE formula (T2K-like); both estimators are always written
binding_energy: 0.027
samples: { include: samples/t2k_like.yaml }
oscillation: { preset: asimov_A }

run: { work_dir: ../work/tiny_test, seed: 20250929 }
