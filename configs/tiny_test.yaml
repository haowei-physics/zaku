# A small production for checking the whole chain by hand: 2000 events per
# MC sample. Same experiment as hk_t2k_like.yaml otherwise.
name: HK_tiny
baseline_km: 295.0
matter: { density_g_cm3: 2.6, electron_fraction: 0.5 }
detector: { material: water, fiducial_mass_kt: 188 }

flux_units: { pot_norm: 1.0e21, bin_norm_GeV: 0.05 }
beam_modes:
  FHC:
    pot: 6.75e21
    flux: { file: "${ZAKU_DATA}/data/flux/t2kflux_2020_plus250kA_nominal.root", t2k_detector: sk }
  RHC:
    pot: 2.025e22
    flux: { file: "${ZAKU_DATA}/data/flux/t2kflux_2020_minus250kA_nominal.root", t2k_detector: sk }
flux_covariance:
  file: "${ZAKU_DATA}/data/flux/t2kflux_2020_covariance.root"
  nd_constraint: 0.8

mc_samples:
  - { beam: FHC, flux: numu,    interaction: numu,    n: 2000 }
  - { beam: FHC, flux: numubar, interaction: numubar, n: 2000 }
  - { beam: FHC, flux: nue,     interaction: nue,     n: 2000 }
  - { beam: FHC, flux: nuebar,  interaction: nuebar,  n: 2000 }
  - { beam: FHC, flux: numu,    interaction: nue,     n: 2000 }
  - { beam: FHC, flux: numubar, interaction: nuebar,  n: 2000 }
  - { beam: RHC, flux: numu,    interaction: numu,    n: 2000 }
  - { beam: RHC, flux: numubar, interaction: numubar, n: 2000 }
  - { beam: RHC, flux: nue,     interaction: nue,     n: 2000 }
  - { beam: RHC, flux: nuebar,  interaction: nuebar,  n: 2000 }
  - { beam: RHC, flux: numu,    interaction: nue,     n: 2000 }
  - { beam: RHC, flux: numubar, interaction: nuebar,  n: 2000 }

run: { work_dir: ../work/tiny_test, seed: 20250929 }
