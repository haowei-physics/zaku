# The HK response tables of the legacy mock_lbl_inputs chain, exported from
# data/hk/response.root: nine true-event categories (numu/numubar/nue/nuebar x
# CCQE/non-QE, NC), each binned in Enu_true (GeV), with the detection
# probability `efficiency` (the legacy h_eff: a tuning factor that absorbs the
# NEUT-vs-tuned-model difference and deliberately exceeds 1) and the
# probability of landing in each output column (the legacy h_mix): 1Rmu,
# 1Re0de, 1Re1de. Columns are matched to samples by name and beam mode (see
# configs/samples/t2k_like.yaml); in antineutrino mode no sample takes the
# 1Re1de column, so that probability mass is rejected, as in the legacy chain.
categories:
  - {name: numuCCQE, select: "cc && PDGnu == 14 && flagCCQE"}
  - {name: numubarCCQE, select: "cc && PDGnu == -14 && flagCCQE"}
  - {name: numuCCnonQE, select: "cc && PDGnu == 14 && !flagCCQE"}
  - {name: numubarCCnonQE, select: "cc && PDGnu == -14 && !flagCCQE"}
  - {name: nueCCQE, select: "cc && PDGnu == 12 && flagCCQE"}
  - {name: nuebarCCQE, select: "cc && PDGnu == -12 && flagCCQE"}
  - {name: nueCCnonQE, select: "cc && PDGnu == 12 && !flagCCQE"}
  - {name: nuebarCCnonQE, select: "cc && PDGnu == -12 && !flagCCQE"}
  - {name: NC, select: "!cc"}
